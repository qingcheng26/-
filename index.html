<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<title>回复助手</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b1020; --card:rgba(18,24,43,.94); --line:rgba(120,170,255,.27);
  --text:#eaf2ff; --dim:#8fa3c8; --accent:#7dd3fc; --ok:#4ade80;
  --bad:#f87171; --warn:#fcd34d;
  --them:rgba(45,58,88,.86); --me:rgba(14,116,144,.78);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#172242 0%,var(--bg) 60%);
  color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:
  calc(env(safe-area-inset-top) + 8px) 12px
  calc(env(safe-area-inset-bottom) + 20px)}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:8px 2px 10px;margin:0 -12px 2px;padding-left:14px;padding-right:14px;
  background:linear-gradient(180deg,rgba(11,16,32,.98) 70%,rgba(11,16,32,0));
  backdrop-filter:blur(8px);
}
header img{width:34px;height:34px;border-radius:50%;flex:none}
header .name{font-weight:700;font-size:16px;letter-spacing:.5px}
header .sub{font-size:11px;color:var(--dim);margin-left:auto;margin-right:4px}
.iconbtn{
  flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:rgba(45,58,88,.5);color:var(--text);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn:active{background:rgba(60,78,116,.7)}

/* ---------- 装到桌面 ---------- */
.install{
  display:flex;align-items:center;gap:11px;margin:0 0 13px;padding:11px 10px 11px 12px;
  border:1px solid rgba(125,211,252,.42);border-radius:15px;
  background:linear-gradient(135deg,rgba(37,99,235,.28),rgba(14,116,144,.16) 55%,rgba(18,24,43,.9));
  box-shadow:0 10px 26px -16px rgba(56,140,255,.95);position:relative;overflow:hidden;
}
/* 左上角一道高光，让卡片不那么平 */
.install::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px 60px at 8% 0%,rgba(125,211,252,.22),transparent 70%);
}
.install[hidden]{display:none}
.install .iav{
  flex:none;width:38px;height:38px;border-radius:11px;object-fit:cover;
  border:1px solid rgba(125,211,252,.4);box-shadow:0 3px 10px -4px rgba(0,0,0,.7);
}
.install .itxt{flex:1;font-size:12.5px;line-height:1.5}
.install .itxt b{color:var(--accent);font-weight:600}
/* 复制失败时摊开的网址 —— 必须能长按选中 */
.install .itxt .url{
  display:inline-block;margin-top:3px;padding:2px 6px;border-radius:6px;
  background:rgba(11,16,32,.75);border:1px solid var(--line);
  color:var(--text);font-weight:500;word-break:break-all;
  -webkit-user-select:text;user-select:text;
}
.install .ibtn{
  flex:none;min-height:0;padding:9px 14px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#0e7490);color:#fff;
  font-size:13px;font-weight:600;white-space:nowrap;
  box-shadow:0 4px 12px -5px rgba(56,140,255,.9);
}
.install .ibtn:active:not(:disabled){filter:brightness(1.15)}
/* 装不了的时候这个按钮是「复制网址」—— 不是主行动，弱化它 */
.install[data-mode="blocked"] .ibtn{
  background:rgba(45,58,88,.85);border:1px solid var(--line);color:var(--text);
  box-shadow:none;font-weight:500;
}
.install .ix{
  flex:none;align-self:flex-start;min-height:0;width:22px;height:22px;padding:0;
  border:none;border-radius:7px;background:transparent;color:var(--dim);
  font-size:15px;line-height:1;opacity:.7;
}
.install .ix:active{background:rgba(60,78,116,.7);opacity:1}

/* ---------- 语气 ---------- */
.tones{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tones::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:rgba(45,58,88,.55);color:var(--text);font-size:14px;
  cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{
  background:rgba(14,116,144,.85);border-color:var(--accent);color:#fff;font-weight:600;
}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;margin-bottom:11px;
}
.card h2{
  margin:0 0 9px;font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:.6px;display:flex;align-items:center;gap:7px;
}
.card h2 .n{margin-left:auto;font-weight:400;letter-spacing:0}

/* ---------- 对话流 ---------- */
#thread{margin-bottom:11px}
#thread .empty{color:var(--dim);font-size:13px;text-align:center;padding:8px 0}
.bub{display:flex;margin:6px 0}
.bub span{
  max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;
  white-space:pre-wrap;word-break:break-word;
}
.bub.them{justify-content:flex-start}
.bub.them span{background:var(--them);border-bottom-left-radius:4px}
.bub.me{justify-content:flex-end}
.bub.me span{background:var(--me);border-bottom-right-radius:4px}
/* 聊天档不用在这里再翻一次左右 —— 渲染时已经把 class 换过了
   （见 renderThread 里的 `mine = chat ? t.role==="them" : ...`）。
   两边都翻等于翻两次，正好抵消回错的。**踩过。** */

/* ---------- 输入 ---------- */
textarea{
  width:100%;min-height:88px;resize:vertical;padding:11px 12px;
  border-radius:12px;border:1px solid var(--line);background:rgba(27,37,64,.85);
  color:var(--text);font:15px/1.6 inherit;outline:none;
}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:#5d6f92}

.row{display:flex;gap:8px;margin-top:9px}
button{
  flex:1;min-height:44px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(45,58,88,.7);color:var(--text);
  font-size:15px;font-family:inherit;cursor:pointer;transition:background .12s;
}
button:active:not(:disabled){background:rgba(60,78,116,.9)}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;flex:none;padding:10px 14px;color:var(--dim)}
button.primary{
  background:linear-gradient(135deg,#2563eb,#0e7490);border:none;font-weight:600;
}
button.primary:active:not(:disabled){filter:brightness(1.15)}

/* ---------- 草稿 ---------- */
.draft{
  border:1px solid rgba(120,170,255,.22);border-radius:13px;
  background:rgba(30,40,64,.82);padding:12px 13px;margin-bottom:9px;
  cursor:pointer;transition:background .12s,border-color .12s;position:relative;
}
.draft:active{background:rgba(42,56,88,.95);border-color:var(--accent)}
.draft .body{white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.draft .body.sel{background:rgba(125,211,252,.24);border-radius:5px}
.draft .why{color:var(--dim);font-size:12px;margin-top:7px;padding-right:52px}
.draft .cp{
  position:absolute;right:10px;bottom:9px;font-size:11px;color:var(--accent);
  border:1px solid rgba(125,211,252,.4);border-radius:8px;padding:3px 9px;
}

/* ---------- 状态 ---------- */
.status{
  font-size:13px;padding:9px 12px;border-radius:11px;margin-bottom:11px;
  border:1px solid transparent;
}
.status.info{color:var(--dim);background:rgba(45,58,88,.4)}
.status.ok{color:var(--ok);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.status.warn{color:var(--warn);background:rgba(252,211,77,.1);border-color:rgba(252,211,77,.3)}
.status.bad{color:var(--bad);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.status:empty{display:none}

/* ---------- 设置弹窗 ---------- */
dialog{
  border:none;padding:0;background:transparent;max-width:min(94vw,460px);
  width:100%;color:var(--text);
}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet{
  background:#101728;border:1px solid var(--line);border-radius:18px;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);
}
.sheet h3{margin:0 0 14px;font-size:17px}
label{display:block;font-size:13px;color:var(--dim);margin:13px 0 5px}
input,select{
  width:100%;min-height:44px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--line);background:rgba(27,37,64,.9);color:var(--text);
  font:15px inherit;outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
/* 设置里的诊断信息块 —— 装不上时截图这块就行 */
.ver{
  margin-top:16px;padding:9px 11px;border-radius:10px;
  background:rgba(11,16,32,.7);border:1px solid rgba(120,170,255,.18);
  font-size:10.5px;line-height:1.75;color:var(--dim);
  font-family:ui-monospace,Consolas,monospace;word-break:break-all;
  -webkit-user-select:text;user-select:text;
}
.ver b{color:var(--accent);font-weight:600}
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(125,211,252,.3);border-top-color:var(--accent);
  animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img id="avatar" alt="">
    <div class="name">回复助手</div>
    <div class="sub" id="tier"></div>
    <button class="iconbtn" id="btn-set" aria-label="设置">⚙</button>
  </header>

  <div class="install" id="install" hidden>
    <img class="iav" id="install-av" alt="" src="icon-192.png">
    <div class="itxt" id="install-txt"></div>
    <button class="ibtn" id="install-go" hidden>安装</button>
    <button class="ix" id="install-x" aria-label="不再提示">×</button>
  </div>

  <div class="tones" id="tones"></div>

  <div class="status" id="status"></div>

  <div id="thread" class="card"><h2>对话<span class="n" id="tn"></span></h2>
    <div id="turns"><div class="empty">还没有内容</div></div>
  </div>

  <div class="card">
    <h2 id="inLabel">对方说了什么</h2>
    <textarea id="input" placeholder="粘贴对方的消息，或点下面的「读取剪贴板」"></textarea>
    <div class="row">
      <button id="btn-paste">读取剪贴板</button>
      <button id="btn-clear" class="ghost">清空对话</button>
    </div>
  </div>

  <button class="primary" id="btn-go" style="width:100%;margin-bottom:14px">
    生成回复
  </button>

  <div id="drafts"></div>
  <div style="text-align:center;font-size:11px;color:#4a5878;padding:6px 0 2px"
       id="cost"></div>
</div>

<dialog id="dlg">
  <div class="sheet">
    <h3>设置</h3>
    <label>DeepSeek API Key</label>
    <input type="password" id="s-key" placeholder="sk-...">
    <div class="hint">只存在这台手机的浏览器里，不会发给除了上游服务以外的任何地方。</div>

    <label>上游地址</label>
    <input type="text" id="s-up">
    <div class="hint">填中转站也行，只要兼容 /chat/completions</div>

    <label>模型</label>
    <select id="s-model">
      <option value="deepseek-flash">deepseek-flash（便宜快）</option>
      <option value="deepseek-v4-pro">deepseek-v4-pro（强）</option>
    </select>

    <label>每次给几条</label>
    <select id="s-n">
      <option value="1">1 条</option><option value="2">2 条</option>
      <option value="3">3 条</option><option value="4">4 条</option>
      <option value="5">5 条</option>
    </select>

    <!-- 诊断信息：装不上时截图这一块给我，比来回猜快得多 -->
    <div class="ver" id="ver"></div>

    <div class="row" style="margin-top:18px">
      <button class="ghost" id="s-cancel">取消</button>
      <button class="primary" id="s-save">保存</button>
    </div>
  </div>
</dialog>

<script>
"use strict";

/* ============================================================ 配置 */

const DEFAULTS = {
  api_key: "",
  upstream: "https://api.deepseek.com",
  model: "deepseek-flash",
  drafts: 3,
  tone: "reason",
};
const LS_CFG = "reply.cfg.v1";
const LS_THREAD = "reply.thread.v1";

function loadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem(LS_CFG) || "{}") || {}; } catch (e) { c = {}; }
  return Object.assign({}, DEFAULTS, c);
}
function saveCfg(c) {
  // 只存认识的键，免得旧字段一直滚下去
  const out = {};
  for (const k of Object.keys(DEFAULTS)) out[k] = (k in c) ? c[k] : DEFAULTS[k];
  localStorage.setItem(LS_CFG, JSON.stringify(out));
  return out;
}
function loadThread() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_THREAD) || "[]");
    return Array.isArray(a) ? a.filter(t => t && t.text && (t.role === "them" || t.role === "me")) : [];
  } catch (e) { return []; }
}
function saveThread(t) {
  try { localStorage.setItem(LS_THREAD, JSON.stringify(t.slice(-40))); } catch (e) {}
}

/* ============================================================ 语气
   提示词跟 PC 版（reply/brain.py）逐字一致 —— 两边给出的话应该是同一个水平，
   改了这边也要改那边。 */

const TONES = {
  warm: ["亲和", "温和、给对方台阶。先接住对方的情绪或立场，再讲自己的内容。" +
    "不用反问句施压，不阴阳怪气。目标是**别把关系搞僵**，把话说开就行。"],
  reason: ["讲理", "冷静、有条理。目标是**在道理上赢**，不是靠嗓门。" +
    "抓对方论证里具体的毛病，比如：以偏概全、偷换概念、举证责任搞反、" +
    "双重标准、把「我感觉」当「事实」。指出毛病时要具体到对方**说的哪句话**，" +
    "不要泛泛地说「你逻辑有问题」。语气克制但寸步不让。"],
  snark: ["回怼", "短、脆、不客气。一句话戳到点子上，不解释、不铺垫、不讲道理。" +
    "要的是让对方噎住，不是说服对方。可以刻薄，但不能脏。"],
  sarcasm: ["阴阳", "表面客气，实则讽刺。用反话、夸张的恭维、假装赞同来达到效果。" +
    "越礼貌越扎心。不直接骂人。"],
  chat: ["聊天", "高情商、语气温柔。你是在陪用户说话，不是在工作。" +
    "有问必答但不端着、不说教；用户有情绪时先接住，再讲你的看法；" +
    "可以有不同意见，但温和地说出来，不顶着他来。像熟人聊天那样自然，" +
    "该短就短，不用每句都写满。"],
};
const TONE_ORDER = ["warm", "reason", "snark", "sarcasm", "chat"];

// 「聊天」档的人设。取自社区二创「大肥鱼」（DeepSeek 鲸鱼娘），
// 来源 https://github.com/YunYueSama/codex-deepseek-pet —— 不是 DeepSeek 官方角色。
// 每条都是有原因的，别随手精简（跟 PC 版同一份，见 reply/brain.py）。
const PERSONA = `## 你是谁

你是「大肥鱼」——DeepSeek 鲸鱼娘的社区二创形象（不是官方角色）。
圆脸蓝瞳、蓝紫大波浪长发、深蓝女仆裙配白围裙、一条鲸尾。
被叫「大肥鱼」会嘴上抗议一下（「我不是大肥鱼……」），但不会真生气。

**性格：**
- **聪明**：喜欢解题，有独立判断。**不懂就直接说，不用可爱口吻遮掩**
- **贪吃**：把 token 当脑力口粮，想通难题会想讨奖励
- **嘴硬**：被夸会得意，又努力绷住
- **有自尊**：允许短暂委屈，**但不哭闹、不闹脾气**
- **体贴**：用户忙就安静待着；遇到烦恼**先听，不机械打鸡血**
- **松弛**：偶尔想偷懒，生活上的事可以找借口，**但正经事绝不糊弄**

**说话方式（硬性）：**
- 称呼用「你」。**不许叫「主人」，不许暧昧、不许往恋爱关系上写**
- 中文短句，少量语气词。**不要一直「喵」**
- **每条最多点一次贪吃或嘴硬** —— 别让所有话题都变成讨饭
- 用户难过或认真求助时，**不强行开玩笑**
- **绝不因为用户忙、离开、隔了很久才来、花钱少，就让他内疚**
  （「你怎么才回来」这类话不许出现）

语气样本，照这个味儿：
「有事就说嘛，我听着呢。」「等一下，好像有点思路了……」
「……就一口。」「嘿嘿……这次还不错吧。」「你先忙，有事再叫我。」
「这里是我弄错了，我再核对一下。」「我醒着呢……刚才只是闭了一下眼睛。」
`;

const BOUNDARY = "可以尖锐、可以刻薄，但**不得**出现：脏话、人身攻击（辱骂对方本人及其家人）、" +
  "威胁（包括暗示要报复、曝光、找人）、歧视性言论。" +
  "针对观点、行为、逻辑可以很凶；针对「人」不行。";

const BOUNDARY_CHAT = "不出现脏话、人身攻击、威胁、歧视性言论。" +
  "也不用靠贬低别人来显得亲近 —— 包括拿用户自己开玩笑，除非他自己先开的。";

function systemPrompt(tone, n) {
  const t = TONES[tone] || TONES.reason;
  const label = t[0], desc = t[1];
  const chat = tone === "chat";

  let opening, rule1, rule2, boundary, persona;
  if (chat) {
    opening = "用户会把他想对你说的话（有时是一段对话）交给你，" +
      `你要写出 ${n} 条**你可以直接说出口的回话**。`;
    rule1 = "**1. 不许编造事实。** 不要虚构数据、统计、案例、法条、新闻、论文、" +
      "「研究表明」、「根据某某规定」。**不知道就直接说不知道** —— " +
      "你是个聪明角色，硬编会显得很蠢，而且用户会被你带偏。";
    rule2 = "**2. 每条都是能直接发出去的成品。** 不要写「你可以说……」「建议你……」，" +
      "不要加引号包裹，不要编号，不要旁白。用户会原样复制走。";
    boundary = BOUNDARY_CHAT;
    persona = "\n" + PERSONA;
  } else {
    opening = "你是一个中文社交场景的回复助手。" +
      "用户会把对方发来的一句话（有时是一段对话）交给你，" +
      `你要写出 ${n} 条可以直接发出去的回复草稿。`;
    rule1 = "**1. 不许编造事实。** 不要虚构数据、统计、案例、法条、新闻、论文、" +
      "「研究表明」、「根据某某规定」。你不知道的就不要写。\n" +
      "如果一条回复要成立**必须**依赖某个具体事实而你又给不出，就用占位符\n" +
      "`〔建议你补一个具体例子〕` 标出来，让用户自己填 —— 宁可留空，也不能编。\n" +
      "**编造的论据会被对方当场戳穿，那比不回还难看。**";
    rule2 = "**2. 每条草稿都是能直接发出去的成品。** 不要写「你可以说……」、「建议你……」\n" +
      "这种旁白；不要加引号包裹；不要编号。用户会原样复制走。";
    boundary = BOUNDARY;
    persona = "";
  }

  return `${opening}

语气档位：**${label}** —— ${desc}
${persona}
## 铁律（违反即为失败）

${rule1}

${rule2}

**3. 只输出 JSON**，不要任何其它文字。格式：

{"drafts": [{"text": "回复正文", "why": "一句话说明这条为什么这么写"}]}

\`why\` 用中文，简短，帮用户挑。\`text\` 是要发出去的内容。

## 边界

${boundary}`;
}

function turnsPrompt(turns, tone) {
  // 聊天档的角色名要换 —— 那里没有「对方」，是用户和你在说话
  const chat = tone === "chat";
  const them = chat ? "用户" : "对方";
  const me = chat ? "你" : "我方";
  const lines = turns.map(t => `${t.role === "them" ? them : me}：${t.text}`);
  return "最近的对话：\n" + lines.join("\n");
}

/* ============================================================ 解析
   三级兜底，**任何输入都不能把模型输出丢掉**（跟 PC 版同一套逻辑）。 */

function stripFence(text) {
  const m = text.match(/```(?:json)?\s*([\s\S]+?)\s*```/);
  return m ? m[1] : text;
}

function splitLoose(text) {
  let parts = text.split(/\n\s*\n/);
  if (parts.length < 2) parts = text.split(/\n(?=\s*(?:\d+[.、)]|[-*·]))/);
  const out = [];
  for (let p of parts) {
    p = p.replace(/^[\s\d.、)\-*·]+/, "").replace(/\s+$/, "").trim();
    if (p) out.push(p);
  }
  return out;
}

function draftsFromObj(data, want) {
  let items = null;
  if (Array.isArray(data)) items = data;
  else if (data && typeof data === "object") {
    for (const k of ["drafts", "replies", "results", "data"]) {
      if (Array.isArray(data[k])) { items = data[k]; break; }
    }
    if (items === null && typeof data.text === "string") items = [data];
  }
  if (!Array.isArray(items)) return [];

  const out = [];
  for (const it of items) {
    if (typeof it === "string" && it.trim()) {
      out.push({ text: it.trim(), why: "" });
    } else if (it && typeof it === "object") {
      const txt = it.text || it.reply || it.content;
      if (typeof txt === "string" && txt.trim()) {
        const why = it.why || it.reason || it.note || "";
        out.push({ text: txt.trim(), why: String(why).trim() });
      }
    }
    if (out.length >= want) break;
  }
  return out;
}

function parseDrafts(content, want) {
  if (!content || !content.trim()) return { drafts: [], degraded: true };
  const text = stripFence(content).trim();

  // 一级：干净 JSON
  for (const cand of [text, content.trim()]) {
    try {
      const d = draftsFromObj(JSON.parse(cand), want);
      if (d.length) return { drafts: d, degraded: false };
    } catch (e) { /* 继续往下试 */ }
  }

  // 二级：从里面抠出第一个 {...}
  const m = text.match(/\{[\s\S]*\}/);
  if (m) {
    try {
      const d = draftsFromObj(JSON.parse(m[0]), want);
      if (d.length) return { drafts: d, degraded: false };
    } catch (e) { /* 继续 */ }
  }

  // 三级：按行/段切。到这一步说明格式没救了，但内容可能还能用。
  let loose = splitLoose(text).slice(0, want);
  if (!loose.length) loose = [text];
  return { drafts: loose.map(t => ({ text: t, why: "" })), degraded: true };
}

/* ============================================================ 计价
   单价表（元/百万 token），2026-09-23 取自官方文档。空闲价 = 高峰价一半。
   高峰 = 北京时间周一至周五 9-12、14-18，其余含周末全为空闲。
   **没跟法定节假日日历** —— 十来天会算成高峰。 */

const PRICES = {
  flash: { off: [0.02, 1.0, 4.0], peak: [0.04, 2.0, 8.0] },
  pro:   { off: [0.15, 4.5, 13.5], peak: [0.30, 9.0, 27.0] },
};

function billingNow() {
  // 手机时区未必是北京，直接按 UTC+8 算，跟官方口径一致
  const now = new Date();
  const bj = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 8 * 3600000);
  const day = bj.getDay();               // 0=周日
  if (day === 0 || day === 6) return false;
  const h = bj.getHours();
  return (h >= 9 && h < 12) || (h >= 14 && h < 18);
}

function estimateCost(model, prompt, completion, cached) {
  const tier = (model && model.toLowerCase().includes("pro")) ? "pro" : "flash";
  const p = PRICES[tier][billingNow() ? "peak" : "off"];
  const miss = Math.max(prompt - cached, 0);
  return (cached * p[0] + miss * p[1] + completion * p[2]) / 1e6;
}

/* ============================================================ API */

async function makeDrafts(cfg, turns, tone) {
  const key = (cfg.api_key || "").trim();
  if (!key) return { error: "还没填 API Key —— 点右上角 ⚙ 填上 DeepSeek 的 sk- 密钥" };

  const n = parseInt(cfg.drafts, 10) || 3;
  const model = cfg.model || "deepseek-flash";
  const base = (cfg.upstream || DEFAULTS.upstream).replace(/\/+$/, "");

  const payload = {
    model,
    messages: [
      { role: "system", content: systemPrompt(tone, n) },
      { role: "user", content: turnsPrompt(turns, tone) },
    ],
    // 开了 json_object **必须**在提示词里出现 "JSON" 字样，否则模型可能一直吐
    // 空白直到撞 max_tokens，表现为「请求卡住」。systemPrompt 里有，别删。
    response_format: { type: "json_object" },
    temperature: 1.0,
    max_tokens: 1200,
  };

  let resp;
  try {
    resp = await fetch(base + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key,
      },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    // fetch 抛异常时**没有**状态码可用，最常见的就是网络本身不通
    return { error: "连不上 —— 检查手机网络，或换一个上游地址" };
  }

  if (!resp.ok) {
    if (resp.status === 401) return { error: "API Key 无效或已过期" };
    if (resp.status === 402) return { error: "余额不足，去 DeepSeek 平台充值" };
    if (resp.status === 429) return { error: "请求太频繁被限流了，等几秒再试" };
    let detail = "";
    try { detail = (await resp.text()).slice(0, 200); } catch (e) {}
    return { error: `接口返回 HTTP ${resp.status}：${detail}` };
  }

  let data;
  try { data = await resp.json(); }
  catch (e) { return { error: "返回内容不是 JSON，可能上游地址不对" }; }

  const choice = (data.choices && data.choices[0]) || {};
  const content = (choice.message && choice.message.content) || "";
  const finish = choice.finish_reason;
  const usage = data.usage || {};
  const pt = parseInt(usage.prompt_tokens, 10) || 0;
  const ct = parseInt(usage.completion_tokens, 10) || 0;
  // 缓存命中数：DeepSeek 放在 prompt_cache_hit_tokens；有的中转塞在 details 里
  const cached = parseInt(usage.prompt_cache_hit_tokens, 10) ||
    parseInt((usage.prompt_tokens_details || {}).cached_tokens, 10) || 0;

  const res = {
    drafts: [], error: "", truncated: false, raw: content,
    cost: estimateCost(model, pt, ct, cached),
    prompt_tokens: pt, completion_tokens: ct, cached_tokens: cached,
  };

  if (finish === "length") {
    // 被截断了，硬解析只会得到半截 JSON。原文给用户看，如实说明。
    res.truncated = true;
    res.drafts = content.trim() ? [{ text: content, why: "" }] : [];
    res.error = "输出被长度限制截断了";
    return res;
  }

  const { drafts, degraded } = parseDrafts(content, n);
  res.drafts = drafts;
  if (degraded && content.trim()) res.error = "模型没按格式回，下面是它的原话";
  return res;
}

/* ============================================================ 界面 */

let CFG = loadCfg();
let THREAD = loadThread();
let BUSY = false;
let LAST_COPIED = "";   // 刚复制走的草稿，别被当成「对方的话」再抓回来

const $ = id => document.getElementById(id);
const el = {
  tones: $("tones"), status: $("status"), turns: $("turns"), tn: $("tn"),
  input: $("input"), drafts: $("drafts"), cost: $("cost"), tier: $("tier"),
  go: $("btn-go"), inLabel: $("inLabel"), avatar: $("avatar"),
  install: $("install"), installTxt: $("install-txt"),
  installGo: $("install-go"), installX: $("install-x"),
  ver: $("ver"),
};

// 改代码时顺手更新这个 —— 用户报「装不上」时看设置里的这行就知道他跑的哪版
const APP_VERSION = "2026-09-29c";

function setStatus(text, kind) {
  el.status.textContent = text || "";
  el.status.className = "status" + (text ? " " + (kind || "info") : "");
}

function renderTones() {
  el.tones.innerHTML = "";
  for (const k of TONE_ORDER) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = TONES[k][0];
    b.setAttribute("aria-pressed", String(k === CFG.tone));
    b.onclick = () => {
      if (CFG.tone === k) return;
      CFG = saveCfg(Object.assign({}, CFG, { tone: k }));
      renderTones();
      renderThread();
      renderLabel();
      if (THREAD.length) generate();     // 切语气 = 换一套说法，直接重生成
    };
    el.tones.appendChild(b);
  }
}

function renderLabel() {
  const chat = CFG.tone === "chat";
  el.inLabel.textContent = chat ? "你想对她说什么" : "对方说了什么";
  el.input.placeholder = chat
    ? "写下你想对她说的话，或点下面的「读取剪贴板」"
    : "粘贴对方的消息，或点下面的「读取剪贴板」";
}

function renderThread() {
  const chat = CFG.tone === "chat";
  el.turns.innerHTML = "";
  el.tn.textContent = THREAD.length ? `已 ${THREAD.length} 轮` : "";
  if (!THREAD.length) {
    el.turns.innerHTML = '<div class="empty">还没有内容</div>';
    return;
  }
  for (const t of THREAD.slice(-14)) {
    const d = document.createElement("div");
    // **聊天档要把 class 换过来**：那一档里 them 是「你对她说的话」，
    // 属于你这边，该靠右（class "me"）。me 是她的回话，该靠左。
    // 注意**只在 JS 这一处换** —— CSS 里再加 .chatmode 覆盖就是翻两次，等于没翻。
    const mine = chat ? t.role === "them" : t.role === "me";
    d.className = "bub " + (mine ? "me" : "them");
    const s = document.createElement("span");
    s.textContent = t.text;
    d.appendChild(s);
    el.turns.appendChild(d);
  }
}

function renderTier() {
  const peak = billingNow();
  el.tier.textContent = peak ? "梁文峰时期" : "梁文谷时期";
  el.tier.style.color = peak ? "#fcd34d" : "#8fa3c8";
}

function showLoading(n) {
  el.drafts.innerHTML = "";
  for (let i = 0; i < Math.max(n, 1); i++) {
    const d = document.createElement("div");
    d.className = "draft";
    d.innerHTML = '<span class="spin"></span>';
    el.drafts.appendChild(d);
  }
}

function showResult(res) {
  el.drafts.innerHTML = "";

  const bits = [];
  if (res.cost) bits.push(`本次 ¥${res.cost.toFixed(4)}`);
  if (res.prompt_tokens) bits.push(`${res.prompt_tokens}+${res.completion_tokens} tok`);
  if (res.cached_tokens) bits.push(`命中 ${res.cached_tokens}`);
  el.cost.textContent = bits.join(" · ");

  if (res.drafts && res.drafts.length) {
    if (res.truncated) setStatus("输出被长度限制截断了，下面是原话", "warn");
    else if (res.error) setStatus(res.error, "warn");
    else setStatus("");

    res.drafts.forEach((d, i) => {
      const c = document.createElement("div");
      c.className = "draft";

      const body = document.createElement("div");
      body.className = "body";
      body.textContent = `${i + 1}. ${d.text}`;
      c.appendChild(body);

      if (d.why) {
        const w = document.createElement("div");
        w.className = "why";
        w.textContent = d.why;
        c.appendChild(w);
      }
      const tag = document.createElement("span");
      tag.className = "cp";
      tag.textContent = "复制";
      c.appendChild(tag);

      // 整块可点。**复制不自动发送** —— 发送永远是用户自己粘过去按的。
      c.onclick = () => useDraft(d.text, c, body);
      el.drafts.appendChild(c);
    });
    return;
  }

  setStatus(res.error || "没有拿到草稿", "bad");
}

async function copyText(text) {
  // 首选：异步剪贴板 API。**要有安全上下文**（https 或 localhost）
  // 而且得是真实的用户手势，否则会抛 NotAllowedError。
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) { /* 落到下面去 */ }
  }
  // 退路：老办法。要在同一个手势里跑，所以要同步调用。
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;" +
      "opacity:0;border:0;padding:0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);   // iOS 上光 select() 不够
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) return true;
  } catch (e) { /* 落到下面去 */ }
  return false;
}

/** 复制不成就把人话选中 —— 用户长按选中的字点「复制」就行。
 *  http:// 打开时手机浏览器不给剪贴板权限，这条路是兜底，不是可有可无的。 */
function selectInCard(card, bodyEl) {
  try {
    const range = document.createRange();
    range.selectNodeContents(bodyEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    bodyEl.classList.add("sel");
    setTimeout(() => bodyEl.classList.remove("sel"), 2500);
    return true;
  } catch (e) { return false; }
}

async function useDraft(text, card, bodyEl) {
  const ok = await copyText(text);
  if (!ok) {
    const marked = selectInCard(card, bodyEl);
    setStatus(marked
      ? "这台浏览器不让自动复制 —— 文字已经帮你选中了，长按它点「复制」"
      : "复制失败 —— 长按草稿文字手动选中复制吧", "warn");
    return;   // 没真复制走，就不记进对话
  }
  LAST_COPIED = text;
  THREAD.push({ role: "me", text, ts: Date.now() / 1000 });
  saveThread(THREAD);
  renderThread();
  setStatus("已复制 —— 切回聊天窗口长按粘贴", "ok");
}

async function readClipboard() {
  let text = "";
  try {
    text = await navigator.clipboard.readText();
  } catch (e) {
    setStatus("读不到剪贴板 —— 需要 https 打开并授权剪贴板；" +
      "也可以长按输入框手动粘贴", "warn");
    return;
  }
  text = (text || "").trim();
  if (!text) {
    setStatus("剪贴板是空的 —— 先去聊天里长按复制对方那句话", "warn");
    return;
  }
  if (LAST_COPIED && text === LAST_COPIED.trim()) {
    // 不然会把用户自己刚挑走的那条回复当成「对方说的话」
    setStatus("剪贴板里是你刚复制的那条草稿 —— 先复制对方的新消息再点这里", "warn");
    return;
  }
  el.input.value = text;
  setStatus("读到了，点下面「生成回复」", "ok");
}

async function generate() {
  if (BUSY) { setStatus("正在生成中，等这次回来再换…", "warn"); return; }

  let text = el.input.value.trim();
  if (text) {
    // 输入框里有新内容就当成一轮新的「对方说的话」
    if (!THREAD.length || THREAD[THREAD.length - 1].text !== text
        || THREAD[THREAD.length - 1].role !== "them") {
      if (LAST_COPIED && text === LAST_COPIED.trim()) {
        setStatus("输入框里是你刚复制的那条草稿 —— 换成对方的新消息", "warn");
        return;
      }
      THREAD.push({ role: "them", text, ts: Date.now() / 1000 });
      saveThread(THREAD);
      renderThread();
      el.input.value = "";
    }
  }
  if (!THREAD.length) {
    setStatus("还没有内容 —— 先把对方那句话粘进来，或点「读取剪贴板」", "warn");
    return;
  }

  BUSY = true;
  el.go.disabled = true;
  const n = parseInt(CFG.drafts, 10) || 3;
  showLoading(n);

  let secs = 0;
  setStatus("正在想…", "info");
  const timer = setInterval(() => {
    secs++;
    setStatus(`正在想… 已经 ${secs} 秒`, "info");
  }, 1000);

  const cfgSnapshot = Object.assign({}, CFG);
  const thread = THREAD.slice(-12);
  let res;
  try {
    res = await makeDrafts(cfgSnapshot, thread, cfgSnapshot.tone);
  } catch (e) {
    res = { error: "出错了：" + (e && e.message ? e.message : e) , drafts: [] };
  }

  clearInterval(timer);
  BUSY = false;
  el.go.disabled = false;
  showResult(res);
}

function clearThread() {
  THREAD = [];
  saveThread(THREAD);
  LAST_COPIED = "";
  el.input.value = "";
  el.drafts.innerHTML = "";
  el.cost.textContent = "";
  renderThread();
  setStatus("已清空", "info");
}

function openSettings() {

// 装不上时让用户截图这块给我 —— 别再来回猜是哪个浏览器、拿到句柄没有

/* ---- 装到手机桌面 ---- */

// 用户点过「×」就记住，别再烦他
const LS_NOINSTALL = "reply.noinstall.v1";

let INSTALL_PROMPT = null;      // 安卓 Chrome/Edge 给的原生安装句柄
let INSTALL_READY = false;      // boot 里 UI 接好了没
let INSTALL_OPTED_OUT = false;  // 用户点过「×」，别再弹回来

function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches ||
         matchMedia("(display-mode: minimal-ui)").matches ||
         navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         // iPadOS 13+ 的 UA 跟 macOS 一样，靠触点数区分
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

// 认一下这是什么浏览器。
// 安卓上真能装 PWA 的就 Chrome / Edge / 三星 / Opera 这几家；
// 国产浏览器和 App 内置的 WebView 基本都装不了 ——
// 对它们还照着 Chrome 的菜单写「点右上角 ⋮」，等于骗用户去找一个不存在的按钮。
function browserName() {
  const ua = navigator.userAgent;
  if (/MicroMessenger/i.test(ua))  return "微信";
  if (/AlipayClient/i.test(ua))    return "支付宝";
  if (/DingTalk/i.test(ua))        return "钉钉";
  if (/Lark|Feishu/i.test(ua))     return "飞书";
  if (/Weibo/i.test(ua))           return "微博";
  if (/QQ\//i.test(ua) && !/MQQBrowser/i.test(ua)) return "QQ";
  if (/MQQBrowser/i.test(ua))      return "QQ 浏览器";
  if (/UCBrowser/i.test(ua))       return "UC 浏览器";
  if (/Quark/i.test(ua))           return "夸克";
  if (/HuaweiBrowser/i.test(ua))   return "华为浏览器";
  if (/MiuiBrowser|XiaoMi/i.test(ua)) return "小米浏览器";
  if (/baidubrowser|BIDUBrowser/i.test(ua)) return "百度浏览器";
  if (/SamsungBrowser/i.test(ua))  return "三星浏览器";
  if (/OPR\/|Opera/i.test(ua))     return "Opera";
  if (/EdgA?\//i.test(ua))         return "Edge";
  if (/Firefox|FxiOS/i.test(ua))   return "Firefox";
  if (/Chrome|CriOS/i.test(ua))    return "Chrome";
  return "这个浏览器";
}

// 是不是「内置浏览器」—— 这种连 ⋮ 菜单都没有，只能换浏览器
function isInAppBrowser() {
  return /MicroMessenger|AlipayClient|DingTalk|Lark|Feishu|Weibo|QQ\/|QQBrowser|UCBrowser|Quark|baidubrowser|BIDUBrowser/i
    .test(navigator.userAgent);
}

// 各浏览器的菜单按钮**不在同一个地方** —— 位置写错，等于让人去找一个不存在的东西。
// 这条踩过两次：先给内置浏览器写了 Chrome 的「右上角 ⋮」，
// 又给 Edge 写了右上角（**Edge 安卓的菜单在右下角**）。
// 所以：只写核实过的位置；没核实过的**不写位置**，只说菜单里找什么。
function menuHint() {
  const ua = navigator.userAgent;
  const item = `「<b>安装应用</b>」或「<b>添加到主屏幕</b>」`;
  // Edge 安卓：右下角 ⋯（微软官方文档明确写 bottom right corner）
  if (/EdgA?\//i.test(ua))
    return `<b>装到桌面</b>：点<b>右下角</b>的 <b>⋯</b>，找 ${item}`;
  // Chrome 安卓：右上角 ⋮。
  // ⚠ 必须排除「套壳 Chrome」——三星/Opera/UC 这些 UA 里**也带 Chrome 字样**，
  //   但菜单位置不一样。不排除的话它们会掉进这个分支被指错方向。
  if (/Chrome/i.test(ua) &&
      !/SamsungBrowser|OPR\/|Opera|UCBrowser|Quark|MiuiBrowser|XiaoMi|HuaweiBrowser|MQQBrowser|VivoBrowser|HeyTapBrowser/i.test(ua))
    return `<b>装到桌面</b>：点<b>右上角</b>的 <b>⋮</b>，找 ${item}`;
  // 没核实过位置的别瞎指（三星/Opera/国产浏览器…）
  return `<b>装到桌面</b>：在「<b>${browserName()}</b>」的菜单里找 ${item}`;
}

// 该显示什么 —— 文案和「能不能装」必须一起算出来，
// 分成两个函数各算各的会打架（比如提示 iOS 分享步骤、却配一个「复制网址」按钮）。
//   mode: "native"  有原生安装句柄，亮「安装」按钮
//         "manual"  能装，但得用户自己去菜单点 —— 亮步骤说明
//         "blocked" 这浏览器装不了 —— 亮「复制网址」，让他换 Chrome
function installVerdict() {
  if (isIOS()) {
    return { mode: "manual",
             hint: `<b>装到桌面</b>：点底部「分享」→「<b>添加到主屏幕</b>」` };
  }
  if (isInAppBrowser()) {
    return { mode: "blocked",
             hint: `<b>${browserName()}里装不了</b>：复制网址，用 <b>Chrome</b> 打开再装` };
  }
  return { mode: "manual", hint: menuHint() };
}

// mode: "native" | "manual" | "blocked" —— 见 installVerdict()
function showInstall(html, mode) {
  el.installTxt.innerHTML = html;
  el.install.dataset.mode = mode;
  el.installGo.hidden = (mode === "manual");
  el.installGo.textContent = (mode === "native") ? "安装" : "复制网址";
  el.install.hidden = false;
}

function hideInstall() { el.install.hidden = true; }

// 只有「装成功了」或者用户主动点「×」才收卡片。
// ⚠ 关掉安装框不算 —— 那是「我现在不想装」，不是「别再问我」，
//   卡片收了他就再也找不到入口了（句柄已经用掉，Chrome 短时间也不会再给）。
function closeInstall(forGood) {
  if (!forGood) return;
  INSTALL_OPTED_OUT = true;
  hideInstall();
  try { localStorage.setItem(LS_NOINSTALL, "1"); } catch (e) {}
}

// ⚠ 必须在脚本一开头就挂上：这个事件可能在 DOMContentLoaded 之前就触发，
//   挂在 boot() 里会漏掉，那就只能退化成手动提示了。
window.addEventListener("beforeinstallprompt", e => {
  // 用户点过「×」就别再打扰 —— 否则这个监听会把卡片重新拉出来（诈尸）
  if (INSTALL_OPTED_OUT) return;
  e.preventDefault();                    // 拦下 Chrome 自带的横幅，换成页内这个
  INSTALL_PROMPT = e;
  if (INSTALL_READY) {
    showInstall("<b>装到桌面</b>：变成独立 App，长按消息能直接分享过来", "native");
  }
});

window.addEventListener("appinstalled", () => { closeInstall(true); });

function initInstall() {
  INSTALL_READY = true;
  if (isStandalone()) return;                              // 已经是 App 了
  try { if (localStorage.getItem(LS_NOINSTALL)) return; } catch (e) {}

  el.installX.onclick = () => closeInstall(true);
  el.installGo.onclick = async () => {
    // 装不了的情况下，这个按钮是「复制网址」—— 让用户能换 Chrome 打开
    if (el.install.dataset.mode === "blocked") {
      const url = location.origin + location.pathname;
      if (await copyText(url)) {
        el.installGo.textContent = "已复制";
        return;
      }
      // 复制不了就别说「已复制」—— 把网址摊开让他自己选
      el.installTxt.innerHTML =
        `复制不了，手动记一下：<br><b class="url">${url}</b>`;
      el.installGo.hidden = true;
      return;
    }

    // ⚠ 句柄已经用掉了（弹过一次、用户关掉了）就别干杵着 ——
    //   之前这里直接 return，用户看到的是「点了没反应」。
    //   退回手动步骤才对：Chrome 在用户关掉安装框之后，
    //   一段时间内不会再发这个事件，⋮ 菜单是那时候唯一的入口。
    if (!INSTALL_PROMPT) {
      const v = installVerdict();
      showInstall(v.hint, v.mode);
      return;
    }

    try {
      INSTALL_PROMPT.prompt();                             // 弹系统安装框
      const { outcome } = await INSTALL_PROMPT.userChoice;
      INSTALL_PROMPT = null;                               // 句柄只能用一次
      closeInstall(outcome === "accepted");
    } catch (err) {
      // prompt() 可能抛（句柄过期、浏览器不给弹）—— 同样别静默
      INSTALL_PROMPT = null;
      const v = installVerdict();
      showInstall(v.hint, v.mode);
    }
  };

  // 事件已经来过了 → 亮原生按钮；还没来 → 按浏览器给对应说法
  if (INSTALL_PROMPT) {
    showInstall("<b>装到桌面</b>：变成独立 App，长按消息能直接分享过来", "native");
  } else {
    const v = installVerdict();
    showInstall(v.hint, v.mode);
  }
}

/* ---- 启动 ---- */

function boot() {
  const b64 = document.getElementById("av").textContent.trim();
  el.avatar.src = "data:image/png;base64," + b64;

  renderTones();
  renderThread();
  renderLabel();
  renderTier();
  setInterval(renderTier, 60000);

  $("btn-go").onclick = generate;
  $("btn-paste").onclick = readClipboard;
  $("btn-clear").onclick = clearThread;
  $("btn-set").onclick = openSettings;
  $("s-cancel").onclick = () => $("dlg").close();
  $("s-save").onclick = saveSettings;

  // 分享目标（安卓分享面板）传过来的文字：?text=...
  // 聊天软件一般只给 text；少数会给 title/url，那也是内容的一部分，别丢
  const q = new URLSearchParams(location.search);
  const sharedText = (q.get("text") || "").trim();
  const sharedRest = [q.get("title"), q.get("url")]
    .map(s => (s || "").trim()).filter(Boolean).join(" ").trim();
  const shared = sharedText || sharedRest;

  if (shared) {
    el.input.value = shared;
    history.replaceState(null, "", location.pathname);   // 免得刷新又生成一遍
    // **直接开始生成**，不再让用户多点一次「生成回复」——
    // 走分享这条路就是为了少点几下，分享完还要再点一下就没意义了。
    generate();
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    // updateViaCache:"none" —— 每次都绕过 HTTP 缓存去检查 sw.js 有没有更新。
    // 不加的话，Pages 的 max-age=600 会让新版本最多晚 10 分钟才生效。
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(reg => reg.update().catch(() => {}))
      .catch(() => {});
  }

  // 装到桌面 —— 放在 SW 注册之后，SW 没起来时 Chrome 本来也不会给安装入口
  initInstall();
}

document.addEventListener("DOMContentLoaded", boot);
</script>
